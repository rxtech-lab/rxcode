name: ExtensionRuntime
options:
  deploymentTarget:
    macOS: "26.0"
packages:
  FixtureWire:
    path: Wire
settings:
  base:
    SWIFT_VERSION: 5.0
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
    ENABLE_HARDENED_RUNTIME: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
    FIXTURE_SERVICE_POINT: workspace-service
    FIXTURE_PRIMARY_CONTAINER_ID: app.rxlab.flowcy.code.runtimecontributors
    FIXTURE_EXTERNAL_CONTAINER_ID: app.rxlab.flowcy.code.externalcontributors
    FIXTURE_PRIMARY_TEAM: $(DEVELOPMENT_TEAM)
    FIXTURE_EXTERNAL_TEAM: P9KK452K8P
    FIXTURE_HOST_ID: app.rxlab.flowcy.code.runtimeprobe
    FIXTURE_CONTAINER_ID: app.rxlab.flowcy.code.runtimecontributors
    EX_ENABLE_EXTENSION_POINT_GENERATION: YES
    GENERATE_INFOPLIST_FILE: YES
targetTemplates:
  Contributor:
    type: extensionkit-extension
    platform: macOS
    settings:
      base:
        INFOPLIST_FILE: Contributor/Info.plist
        CODE_SIGN_ENTITLEMENTS: Contributor/Contributor.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - package: FixtureWire
targets:
  RuntimeProbe:
    type: application
    platform: macOS
    sources:
      - path: Host
        excludes: [Info.plist, Host.entitlements]
      - ../../RxCode/Services/Extensions/WorkspaceExtensionPoint.swift
      - ../../RxCode/Views/Settings/SystemExtensionBrowser.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FIXTURE_HOST_ID)
        INFOPLIST_FILE: Host/Info.plist
        CODE_SIGN_ENTITLEMENTS: Host/Host.entitlements
    dependencies:
      - package: FixtureWire
  Contributors:
    type: application
    platform: macOS
    sources: [Container]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FIXTURE_CONTAINER_ID)
    dependencies:
      - target: Service
      - target: Sidebar
  Service:
    templates: [Contributor]
    sources: [Contributor/FixtureService.swift, Contributor/ServiceExtension.swift]
    settings:
      base:
        FIXTURE_POINT_NAME: $(FIXTURE_SERVICE_POINT)
        PRODUCT_BUNDLE_IDENTIFIER: $(FIXTURE_CONTAINER_ID).service
  Sidebar:
    templates: [Contributor]
    sources: [Contributor/FixtureService.swift, Contributor/SidebarExtension.swift]
    settings:
      base:
        FIXTURE_POINT_NAME: workspace
        PRODUCT_BUNDLE_IDENTIFIER: $(FIXTURE_CONTAINER_ID).sidebar
