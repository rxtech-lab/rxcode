apiVersion: v1
kind: ConfigMap
metadata:
  name: rxcode-relay-config
  namespace: rxcode-relay
  labels:
    app: rxcode-relay
data:
  # Listen address inside the pod. The Service targets this port.
  RELAY_ADDR: ":8787"
  # APNs topic must equal the RxCode Mobile bundle identifier exactly.
  APNS_TOPIC: "com.idealapp.RxCode.Mobile"
  # Fallback only for old desktop builds that omit per-device APNs environment.
  # Current desktop clients send sandbox/production per paired device.
  APNS_PRODUCTION: "true"
  # Cluster-level Redis (namespace `redis`), reused as the pub/sub backplane
  # so the relay can run multiple replicas. Reachable from any namespace via
  # this FQDN; auth-less. Remove this key to fall back to single-node mode.
  REDIS_URL: "redis://redis.redis.svc.cluster.local:6379"
  # Firebase project ID used when forwarding Android pushes via the FCM HTTP v1
  # API. The corresponding service-account JSON is provided through
  # FCM_SERVICE_ACCOUNT_B64 in `secrets.yaml`. Non-sensitive on its own.
  FCM_PROJECT_ID: "xcode-64741"
