apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: rxcode-relay
  namespace: rxcode-relay
  labels:
    app: rxcode-relay
spec:
  # One relay pod per node. Each node lives in a different AWS region
  # (ap-east-1 / ap-southeast-1 / …), so a DaemonSet pins exactly one replica
  # per region and auto-extends as new regional nodes join the cluster — no
  # replica count or topology labels to maintain. The Redis backplane
  # (REDIS_URL) still fans WebSocket envelopes across every pod, so a desktop
  # and its mobile peer may connect to relays in different regions.
  selector:
    matchLabels:
      app: rxcode-relay
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      # Keep serving WebSocket clients on the surviving regional pods while one
      # node updates. With only one pod per node, maxUnavailable: 1 rolls a
      # single region at a time.
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: rxcode-relay
    spec:
      containers:
        - name: relay
          image: ghcr.io/rxtech-lab/rxcode-relay:latest
          ports:
            - containerPort: 8787
              protocol: TCP
          envFrom:
            - configMapRef:
                name: rxcode-relay-config
            - secretRef:
                name: rxcode-relay-secrets
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8787
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8787
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      restartPolicy: Always
