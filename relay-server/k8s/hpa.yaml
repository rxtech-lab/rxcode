apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rxcode-relay
  namespace: rxcode-relay
  labels:
    app: rxcode-relay
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rxcode-relay
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      # WebSocket clients reconnect onto surviving pods; let connections drain
      # before removing capacity rather than thrashing replicas.
      stabilizationWindowSeconds: 300
